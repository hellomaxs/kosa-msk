name: Deploy to Yandex Cloud

on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read

env:
  AWS_ACCESS_KEY_ID: ${{ secrets.YC_S3_ACCESS_KEY }}
  AWS_SECRET_ACCESS_KEY: ${{ secrets.YC_S3_SECRET_KEY }}
  AWS_DEFAULT_REGION: ru-central1
  YC_BUCKET: kosa-msk.ru
  YC_S3_ENDPOINT: https://storage.yandexcloud.net

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build (static export)
        run: npm run build

      # Only _next/static/* is safe to cache forever: Next.js content-hashes
      # those filenames. Everything in public/ keeps its name across deploys,
      # so immutable caching there serves stale files until the name changes.
      - name: Sync build output (immutable, content-hashed)
        run: |
          aws s3 sync out/_next "s3://${YC_BUCKET}/_next" \
            --endpoint-url "${YC_S3_ENDPOINT}" \
            --delete \
            --cache-control "public,max-age=31536000,immutable"

      - name: Sync everything else (revalidate)
        run: |
          aws s3 sync out/ "s3://${YC_BUCKET}" \
            --endpoint-url "${YC_S3_ENDPOINT}" \
            --delete \
            --exclude "_next/*" \
            --cache-control "public,max-age=300,must-revalidate"

      # No CDN purge step: with the 5-minute revalidate above the CDN picks
      # changes up on its own. Purging would need a YC token in secrets.
